[project]
name = "wastara-model"
version = "0.1.0"
description = "Wastara garment detection, tracking, and defect inspection pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "ultralytics>=8.4.126",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "websocket-client>=1.8.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
wastara-detect = "src.main:main"
wastara-inspect = "src.pipeline.cli:main"
wastara-serve = "src.service.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
